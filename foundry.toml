[profile.default]
src = "src"
out = "out"
libs = ["lib"]
ast = true
ffi = true
build_info = true
extra_output = ["storageLayout"]
gas_reports = ["UniversalToken", "TransparentUpgradeableProxy"]

[fuzz]
runs = 256

[invariant]
runs = 64
depth = 32
fail_on_revert = false

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
